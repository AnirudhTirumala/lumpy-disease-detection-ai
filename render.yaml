services:
  - type: web
    name: lumpy-ai-ml
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: MODEL_PATH
        value: /app/models/best.pt
      - key: WORK_DIR
        value: /tmp/lumpy-ai
